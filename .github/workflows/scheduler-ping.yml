name: MailDM scheduler ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Wake MailDM scheduler
        env:
          MAILDM_BASE_URL: ${{ secrets.MAILDM_BASE_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          set -euo pipefail
          test -n "$MAILDM_BASE_URL"
          test -n "$SCHEDULER_SECRET"
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
            --request POST \
            --header "X-Scheduler-Secret: $SCHEDULER_SECRET" \
            --header "Content-Length: 0" \
            "${MAILDM_BASE_URL%/}/api/scheduler/tick"
